name: Bug report
description: Something in the template doesn't work as documented
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Before filing: does `npm run dev` work on a **fresh clone with no
        `.env.local`**? If yes, the issue is likely in your configuration
        rather than the template — try Discussions first.

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Include the full error output if there is one.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Use this template to create a repo
        2. npm install
        3. npm run dev
        4. ...
    validations:
      required: true

  - type: dropdown
    id: mode
    attributes:
      label: Which mode?
      options:
        - Mock mode (no Sanity configured)
        - Connected to my own Sanity project
    validations:
      required: true

  - type: input
    id: node
    attributes:
      label: Node version
      placeholder: "output of `node -v`"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: OS
      placeholder: "macOS 15 / Ubuntu 24.04 / Windows 11"
    validations:
      required: true
