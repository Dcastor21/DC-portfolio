name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly run catches breakage from upstream dependency drift — the
  # thing most likely to make a template look abandoned.
  schedule:
    - cron: "0 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      # No secrets here on purpose: the build must succeed with zero
      # configuration, which is the guarantee this template makes.
      - name: Build (mock mode)
        run: npm run build
